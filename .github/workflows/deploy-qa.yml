name: Deploy exact QA commit

on:
  push: { branches: [qa] }
  workflow_dispatch:
    inputs:
      sha: { description: Exact commit already contained in qa, required: true, type: string }

permissions: { contents: read }
concurrency: { group: nayori-platform-qa-deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: qa
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: nayori_test, POSTGRES_PASSWORD: nayori_test, POSTGRES_USER: nayori_test }
        options: >-
          --health-cmd "pg_isready -U nayori_test -d nayori_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://nayori_test:nayori_test@127.0.0.1:5432/nayori_test
      DATABASE_INTEGRATION: "true"
      NODE_ENV: test
      DELIVERY_LEDGER_ENABLED: "false"
      PAYMENT_VERIFICATION_ENABLED: "false"
      QUOTE_ISSUANCE_ENABLED: "false"
      SERVICE_ORIGIN: http://localhost:8080
      RECONCILIATION_ENABLED: "false"
      SETTLEMENT_ENABLED: "false"
      SPONSORSHIP_ENABLED: "false"
      STACKS_NETWORK: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: qa }
      - name: Select exact QA SHA
        id: release
        env: { REQUESTED_SHA: "${{ inputs.sha || github.sha }}" }
        run: |
          printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin qa
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/qa
          git checkout --detach "$REQUESTED_SHA"
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Upload and deploy on the VPS
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SSH_HOST: ${{ secrets.NAYORI_QA_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.NAYORI_QA_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAYORI_QA_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/nayori_qa
          chmod 600 ~/.ssh/nayori_qa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar "$RELEASE_SHA" | gzip -9 > /tmp/nayori-release.tar.gz
          ARCHIVE_SHA=$(sha256sum /tmp/nayori-release.tar.gz | cut -d' ' -f1)
          ssh -i ~/.ssh/nayori_qa -o BatchMode=yes nayori-deploy@"$SSH_HOST" \
            "stage PerkOS-Nayori-Platform qa $RELEASE_SHA $ARCHIVE_SHA" < /tmp/nayori-release.tar.gz
          ssh -i ~/.ssh/nayori_qa -o BatchMode=yes nayori-deploy@"$SSH_HOST" \
            "deploy PerkOS-Nayori-Platform qa $RELEASE_SHA $ARCHIVE_SHA"

