name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nayori_test
          POSTGRES_PASSWORD: nayori_test
          POSTGRES_USER: nayori_test
        options: >-
          --health-cmd "pg_isready -U nayori_test -d nayori_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://nayori_test:nayori_test@127.0.0.1:5432/nayori_test
      NODE_ENV: test
      SERVICE_ORIGIN: http://localhost:8080
      SETTLEMENT_ENABLED: "false"
      SPONSORSHIP_ENABLED: "false"
      STACKS_NETWORK: testnet
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Prove migrations are idempotent
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
