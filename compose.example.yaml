name: perkos-nayori-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nayori
      POSTGRES_PASSWORD: nayori-local-only
      POSTGRES_USER: nayori
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nayori -d nayori"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      DATABASE_POOL_MAX: 10
      DATABASE_QUERY_TIMEOUT_MS: 10000
      DATABASE_SSL: disable
      DATABASE_URL: postgresql://nayori:nayori-local-only@postgres:5432/nayori
      LOG_LEVEL: info
      NODE_ENV: production
      RELEASE_SHA: local-compose
      SERVICE_ORIGIN: http://localhost:8080
      QUOTE_ISSUANCE_ENABLED: "false"
      SETTLEMENT_ENABLED: "false"
      SPONSORSHIP_ENABLED: "false"
      STACKS_NETWORK: testnet
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    internal: true

volumes:
  postgres-data:
